name: Build Patched Image (GHCR)

# Builda a imagem = v8.10.0 (release oficial que o server01 rodava) + APENAS o
# patch de Width/Height (thumbnail cortado). Buildada FORA de qualquer servidor
# (runner do Actions tem RAM de sobra pro build Go+cgo). Publica em ghcr.io com
# a tag v8.10.0-thumbnail-fix. O server01 (1.9GB RAM, sem swap) só dá
# `docker compose pull` - NUNCA build local.
#
# IMPORTANTE: esta branch parte da TAG v8.10.0, não do main. O main tem 6
# commits a mais (per-device-login refactor + suporte WHATSAPP_PROXY) que
# mudam a arquitetura de sessão e derrubaram o login ao trocar de imagem em
# 2026-07-09. Manter atrelado à v8.10.0 mantém a mudança mínima (só o patch).

on:
  push:
    branches:
      - thumbnail-fix-v8.10.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./docker/golang.Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:v8.10.0-thumbnail-fix
