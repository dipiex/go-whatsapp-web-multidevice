name: Build Patched Image (GHCR)

# Builda a imagem com o patch de Width/Height (thumbnail cortado) FORA de
# qualquer servidor - no runner do GitHub Actions, que tem RAM de sobra pro
# build Go+cgo (go-sqlite3). Publica em ghcr.io. O server01 (1.9GB RAM, sem
# swap) NUNCA deve buildar isso localmente - ele só dá `docker compose pull`
# da imagem pronta. Só amd64 porque o server01 é x86_64.

on:
  push:
    branches:
      - fix/image-video-thumbnail-aspect-ratio
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./docker/golang.Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:thumbnail-fix
